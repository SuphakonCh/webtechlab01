<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Fruitables</title>
    <meta name="description" content="Create a Fruitables account to start shopping." />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* =============================================
           DESIGN TOKENS & RESET
        ============================================= */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --color-bg:          #0d1117;
            --color-surface:     #161b22;
            --color-border:      rgba(255,255,255,0.08);
            --color-text:        #e6edf3;
            --color-muted:       #7d8590;
            --color-primary:     #81c784;
            --color-primary-dk:  #4caf50;
            --color-accent:      #a5d6a7;
            --color-error:       #f87171;
            --color-error-bg:    rgba(248,113,113,0.10);
            --color-success-bg:  rgba(129,199,132,0.12);
            --radius-lg:         16px;
            --radius-md:         10px;
            --radius-sm:         6px;
            --transition:        0.25s ease;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(76,175,80,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 90%, rgba(129,199,132,0.08) 0%, transparent 60%);
        }

        /* =============================================
           CARD
        ============================================= */
        .card {
            width: 100%;
            max-width: 460px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            box-shadow:
                0 0 0 1px rgba(129,199,132,0.04),
                0 20px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.45s cubic-bezier(0.22,1,0.36,1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Brand */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--color-primary-dk), var(--color-accent));
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            font-size: 20px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--color-text);
        }

        /* Heading */
        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--color-muted);
            font-size: 14px;
            margin-bottom: 22px;
        }

        /* =============================================
           FORM
        ============================================= */
        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-muted);
            margin-bottom: 7px;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: var(--color-text);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(129,199,132,0.15);
        }

        input::placeholder { color: var(--color-muted); }

        .hint {
            font-size: 12px;
            color: var(--color-muted);
            margin-top: 6px;
        }

        /* Submit Button */
        #btn-register {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--color-primary-dk), var(--color-accent));
            border: none;
            border-radius: var(--radius-md);
            color: #0d1117;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
            box-shadow: 0 4px 20px rgba(76,175,80,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #btn-register:hover:not(:disabled) {
            opacity: 0.88;
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(76,175,80,0.45);
        }

        #btn-register:active:not(:disabled) {
            transform: translateY(0);
        }

        #btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            width: 17px; height: 17px;
            border: 2px solid rgba(13,17,23,0.3);
            border-top-color: #0d1117;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Alerts */
        .alert {
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 16px;
            display: none;
            align-items: flex-start;
            gap: 9px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .alert-error {
            background: var(--color-error-bg);
            border: 1px solid rgba(248,113,113,0.25);
            color: var(--color-error);
        }

        .alert-success {
            background: var(--color-success-bg);
            border: 1px solid rgba(129,199,132,0.25);
            color: var(--color-primary);
        }

        .alert.visible { display: flex; }

        .switch {
            margin-top: 18px;
            font-size: 13px;
            color: var(--color-muted);
        }

        .switch a {
            color: var(--color-accent);
            text-decoration: none;
        }

        .switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<main class="card" role="main">

    <div class="brand">
        <div class="brand-icon" aria-hidden="true">F</div>
        <span class="brand-name">Fruitables</span>
    </div>

    <h1>Create your account</h1>
    <p class="subtitle">Register to start shopping fresh fruit and vegetables.</p>

    <form id="register-form" novalidate>
        <div class="field">
            <label for="input-name">Full name</label>
            <input
                id="input-name"
                type="text"
                placeholder="Your name"
                autocomplete="name"
                required
            />
        </div>

        <div class="field">
            <label for="input-email">Email address</label>
            <input
                id="input-email"
                type="email"
                placeholder="you@fruitables.com"
                autocomplete="email"
                required
            />
        </div>

        <div class="field">
            <label for="input-password">Password</label>
            <input
                id="input-password"
                type="password"
                placeholder="Create a strong password"
                autocomplete="new-password"
                required
            />
            <p class="hint">At least 8 characters, 1 uppercase, 1 special (!@#$%^&*).</p>
        </div>

        <button id="btn-register" type="submit">
            <div class="spinner" id="spinner" aria-hidden="true"></div>
            <span id="btn-text">Create Account</span>
        </button>
    </form>

    <div id="alert-error" class="alert alert-error" role="alert" aria-live="polite">
        <span>!</span>
        <span id="error-message">Registration failed.</span>
    </div>

    <div id="alert-success" class="alert alert-success" role="status" aria-live="polite">
        <span>OK</span>
        <span id="success-message">Registration successful! Redirecting...</span>
    </div>

    <p class="switch">Already have an account? <a href="login.html">Sign in</a></p>

</main>

<script>
    // =============================================
    // REGISTER FLOW — register.html
    // =============================================
    // 1. Validate password rule on the frontend
    // 2. Send POST /api/auth/register with user details
    // 3. On 201: show success and redirect to login
    // 4. On 400/500: show an error message
    // =============================================

    const API_URL = 'http://localhost:3000/api/auth/register';

    const PASSWORD_REGEX = /^(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}$/;

    // DOM references
    const form = document.getElementById('register-form');
    const nameInput = document.getElementById('input-name');
    const emailInput = document.getElementById('input-email');
    const passwordInput = document.getElementById('input-password');
    const btnRegister = document.getElementById('btn-register');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('spinner');
    const alertError = document.getElementById('alert-error');
    const errorMessage = document.getElementById('error-message');
    const alertSuccess = document.getElementById('alert-success');
    const successMsg = document.getElementById('success-message');

    function setLoading(loading) {
        btnRegister.disabled = loading;
        spinner.style.display = loading ? 'block' : 'none';
        btnText.textContent = loading ? 'Creating…' : 'Create Account';
    }

    function showError(message) {
        alertError.classList.add('visible');
        alertSuccess.classList.remove('visible');
        errorMessage.textContent = message;
    }

    function showSuccess(name) {
        alertSuccess.classList.add('visible');
        alertError.classList.remove('visible');
        successMsg.textContent = `Welcome, ${name}! Redirecting to sign in...`;
    }

    function clearAlerts() {
        alertError.classList.remove('visible');
        alertSuccess.classList.remove('visible');
    }

    function isPasswordValid(password) {
        return PASSWORD_REGEX.test(password);
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearAlerts();

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!name || !email || !password) {
            showError('Please fill in all fields.');
            return;
        }

        if (!isPasswordValid(password)) {
            showError('Password must be 8+ chars with 1 uppercase and 1 special (!@#$%^&*).');
            return;
        }

        setLoading(true);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password }),
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess(data.user.firstName || name);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
            } else {
                showError(data.message || 'Registration failed. Please try again.');
            }
        } catch (networkError) {
            showError('Cannot connect to the server. Make sure the backend is running on port 3000.');
            console.error('Network error:', networkError);
        } finally {
            setLoading(false);
        }
    });
</script>

</body>
</html>
